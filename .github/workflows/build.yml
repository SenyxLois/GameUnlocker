name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/release.jks
            echo "Release keystore decoded."
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Missing one or more required signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          else
            echo "Signing secrets not available on pull_request; falling back to debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get App Version Name
        id: version
        run: echo "app_version=$(sed -n 's/^[[:space:]]*versionName "\([0-9.]*\)".*/\1/p' app/build.gradle | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk game-spoofer-v${{ steps.version.outputs.app_version }}.apk

      - name: Verify APK Signature & Certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_PATH="game-spoofer-v${{ steps.version.outputs.app_version }}.apk"
          APKSIGNER=$(command -v apksigner || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools."
            exit 1
          fi

          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          printf '%s\n' "$VERIFY_OUT"

          if [ -f app/release.jks ]; then
            if printf '%s\n' "$VERIFY_OUT" | grep -q "CN=Android Debug"; then
              echo "::error::APK is signed with Android Debug certificate instead of release keystore."
              exit 1
            fi

            APK_SHA256=$(printf '%s\n' "$VERIFY_OUT" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            KEYSTORE_SHA256=$(keytool -J-Duser.language=en -list -v -keystore app/release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA-\{0,1\}256:[[:space:]]*//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')

            echo "APK SHA-256:      $APK_SHA256"
            echo "Keystore SHA-256: $KEYSTORE_SHA256"

            if [ -z "$APK_SHA256" ] || [ -z "$KEYSTORE_SHA256" ] || [ "$APK_SHA256" != "$KEYSTORE_SHA256" ]; then
              echo "::error::APK certificate SHA-256 digest does not match release keystore."
              exit 1
            fi
          fi

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game Spoofer
          path: game-spoofer-v${{ steps.version.outputs.app_version }}.apk

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: game-spoofer-v${{ steps.version.outputs.app_version }}.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.app_version }}
          name: ${{ steps.version.outputs.app_version }}
          prerelease: false
