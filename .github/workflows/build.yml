name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Get App Version Name
        id: version
        run: echo "app_version=$(sed -n 's/^[[:space:]]*versionName "\([0-9.]*\)".*/\1/p' app/build.gradle | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk game-spoofer-v${{ steps.version.outputs.app_version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game Spoofer
          path: game-spoofer-v${{ steps.version.outputs.app_version }}.apk

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: game-spoofer-v${{ steps.version.outputs.app_version }}.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.app_version }}
          name: ${{ steps.version.outputs.app_version }}
          prerelease: false
